[package]
name = "dev-oidc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
serde_json = "1"
serde_urlencoded = "0.7"
tokio = { version = "1", features = ["rt", "macros", "net"] }

# RSA key generation (first run only) is very slow unoptimized.
[profile.dev.package."*"]
opt-level = 3

# The edge's OIDC client, for an end-to-end test.
[dev-dependencies]
openidconnect = "4.0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "net", "rt-multi-thread"] }
