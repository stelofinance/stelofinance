version: "3"

# `.env` is not loaded here on purpose: the edge loads it itself (debug builds),
# and loading it into the shell would leak it into every `spacetime` command
# run from a task (see AGENTS.md).

tasks:
  stdb:
    desc: Local SpacetimeDB
    cmds:
      - spacetime start --data-dir tmp/spacetimedb

  stdb:dev:
    desc: Watch module; rebuild, publish, regenerate bindings
    cmds:
      - spacetime dev --server-only -y

  edge:
    desc: Topcoat edge (with the dev OIDC provider on :9090)
    env:
      PORT: "8080"
    cmds:
      - topcoat dev
