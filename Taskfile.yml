version: "3"

dotenv: [".env"]

tasks:
  live:
    desc: SpacetimeDB + module watch + edge
    deps: [stdb, _live]

  stdb:
    desc: Local SpacetimeDB
    cmds:
      - spacetime start --data-dir tmp/spacetimedb

  stdb:dev:
    desc: Watch module; rebuild, publish, regenerate bindings
    cmds:
      - spacetime dev --server-only -y

  edge:
    desc: Topcoat edge
    env:
      PORT: "8080"
    cmds:
      - topcoat dev

  _live:
    internal: true
    cmds:
      - |
        n=0
        until spacetime server ping local >/dev/null 2>&1; do
          n=$((n + 1))
          if [ "$n" -ge 120 ]; then
            echo "timed out waiting for SpacetimeDB"
            exit 1
          fi
          sleep 0.25
        done
      - spacetime dev -y
