# fly.toml app configuration file generated for stelofinance on 2024-12-08
# See https://docs.fly.io/reference/configuration/ for information about how to use this file.

app = "stelofinance"
primary_region = "iad"

# Stateless Topcoat edge. Secrets stay on the app via `fly secrets` (not here):
# BITAUTH_CLIENT_SECRET, SPACETIMEAUTH_CLIENT_SECRET
[env]
	PORT = "8080"
	HOST = "0.0.0.0"
	ENV = "prod"
	BITAUTH_ISSUER = "https://auth.trinit.is/"
	BITAUTH_CLIENT_ID = "nintron-stelofinance"
	BITAUTH_REDIRECT_URL = "https://stelo.finance/auth/bitauth/callback"
	STDB_HOST = "https://maincloud.spacetimedb.com"
	STDB_DATABASE = "stelofinance-prod"
	SPACETIMEAUTH_ISSUER = "https://auth.spacetimedb.com/oidc"
	SPACETIMEAUTH_CLIENT_ID = "client_033wW7fObq5GPPc4ESCFsF"
	SPACETIMEAUTH_REDIRECT_URL = "https://stelo.finance/auth/spacetimeauth/callback"

[http_service]
	internal_port = 8080
	force_https = true
	auto_stop_machines = "suspend"
	auto_start_machines = true
	min_machines_running = 1

	[[http_service.checks]]
		grace_period = "15s"
		interval = "30s"
		method = "GET"
		timeout = "5s"
		path = "/health"


[[vm]]
	size = "shared-cpu-1x"
	memory = "256mb"
