# fly.toml app configuration file generated for stelofinance on 2024-12-08
# See https://docs.fly.io/reference/configuration/ for information about how to use this file.

app = "stelofinance"
primary_region = "iad"

# Stateless Topcoat edge. Secrets stay on the app via `fly secrets` (not here):
# OIDC_CLIENT_SECRET
[env]
	PORT = "8080"
	HOST = "0.0.0.0"
	ENV = "prod"
	# User login provider. OIDC_ISSUER must equal the module's USER_OIDC_ISSUER
	# (set in .github/workflows/deploy.yaml).
	OIDC_ISSUER = "https://auth.trinit.is/"
	OIDC_CLIENT_ID = "nintron-stelofinance"
	OIDC_REDIRECT_URL = "https://stelo.finance/auth/oidc/callback"
	OIDC_PROVIDER_NAME = "BitAuth"
	STDB_HOST = "https://maincloud.spacetimedb.com"
	STDB_DATABASE = "stelofinance-prod"

[http_service]
	internal_port = 8080
	force_https = true
	auto_stop_machines = "suspend"
	auto_start_machines = true
	min_machines_running = 1

	[[http_service.checks]]
		grace_period = "15s"
		interval = "30s"
		method = "GET"
		timeout = "5s"
		path = "/health"


[[vm]]
	size = "shared-cpu-1x"
	memory = "256mb"
