[package]
	name = "stelofinance"
	version = "0.5.0"
	edition = "2024"

[dependencies]
	base64 = "0.22"
	futures-core = "0.3"
	futures-util = "0.3"
	getrandom = "0.3"
	openidconnect = "4.0.1"
	reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
	serde = { version = "1", features = ["derive"] }
	spacetimedb-sdk = "2.7.*"
	tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
	topcoat = { version = "0.5.0", features = ["tailwind", "icon-iconify", "datastar"] }

[dev-dependencies]
	tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[build-dependencies]
	topcoat = { version = "0.5.0", default-features = false, features = [
		"tailwind",
		"icon-iconify",
	] }
