name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Required on the `production` GitHub Environment:
#   secrets.SPACETIMEDB_TOKEN  — `spacetime login show --token` as the DB owner
#   secrets.FLY_STELO          — Fly API token (also used as registry password)
#   vars.FLY_STELO_APP_NAME    — Fly app name (registry.fly.io/<name>)

jobs:
  deploy-stelo:
    name: Deploy Stelo to production
    runs-on: ubuntu-latest
    environment: 'production'
    concurrency:
      group: deploy-production-stelo
      cancel-in-progress: true

    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Use nix
      uses: nixbuild/nix-quick-install-action@v34
      with:
        nix_version: "2.31.2"

    - name: Restore and save Nix store
      uses: nix-community/cache-nix-action@v6
      with:
        # restore and save a cache using this key
        primary-key: nix-${{ runner.os }}-stelo-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        # if there's no cache hit, restore a cache by this prefix
        restore-prefixes-first-match: nix-${{ runner.os }}-stelo-
        # collect garbage until Nix store size (in bytes) is at most this number
        # before trying to save a new cache
        # 1G = 1073741824
        gc-max-store-size-linux: 3G

    - name: Build module WASM
      run: nix build .#module -o module-out

    - name: Publish module to Maincloud
      env:
        SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
      run: |
        set -euo pipefail
        if [[ -z "${SPACETIMEDB_TOKEN}" ]]; then
          echo "SPACETIMEDB_TOKEN is not set on the production environment." >&2
          echo "Create it from: spacetime login show --token" >&2
          exit 1
        fi
        nix shell .#spacetimedb --command spacetime login --token "$SPACETIMEDB_TOKEN"
        # spacetime.json defaults to server=local; override to maincloud.
        # Do not pass --delete-data or --break-clients: a breaking schema fails the job.
        nix shell .#spacetimedb --command spacetime publish \
          -s maincloud stelofinance-prod -y \
          --bin-path module-out/stelofinance.wasm

    - name: Build container
      run: nix build .#container

    - name: Load image
      run: ./result | podman load

    - name: Push image
      run: podman push --creds "x:${{ secrets.FLY_STELO }}" localhost/stelo docker://registry.fly.io/${{ vars.FLY_STELO_APP_NAME }}:latest

    - name: Use Fly
      uses: superfly/flyctl-actions/setup-flyctl@master

    - name: Deploy to Fly
      run: flyctl deploy -i registry.fly.io/${{ vars.FLY_STELO_APP_NAME }}:latest -c fly.toml
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_STELO }}
